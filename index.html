<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Love Card — Send a Little Love</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page" aria-live="polite">
    <section class="card-wrap">
      <div class="card" id="card" tabindex="0" aria-label="Love card. Press space to flip.">
        <!-- Front -->
        <article class="card-face card-front">
          <h1 class="brand"><span class="logo">❤</span> Love Card</h1>
          <p class="tag">A little note, with a lot of heart.</p>
          <button class="btn primary" id="openBtn" aria-controls="compose">Write a message</button>
          <div class="preview-hero" aria-hidden="true">
            <svg class="heart-hero" viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
              <path fill="currentColor" d="M12 21s-8-5.5-8-11.5S7 2 12 7c5-5 8 1.5 8 2.5S12 21 12 21z"/>
            </svg>
          </div>
        </article>

        <!-- Back: Compose -->
        <article class="card-face card-back" id="compose" role="region" aria-labelledby="composeTitle" hidden>
          <h2 id="composeTitle">Compose your message</h2>

          <label class="field">
            <span class="label">To</span>
            <input id="toInput" type="text" placeholder="Their name" aria-label="Recipient name">
          </label>

          <label class="field">
            <span class="label">Message</span>
            <textarea id="msgInput" placeholder="Write something sweet..." rows="4" aria-label="Message"></textarea>
          </label>

          <div class="controls">
            <button class="btn secondary" id="backBtn">Back</button>
            <button class="btn primary" id="sendBtn">Send ❤️</button>
          </div>

          <div class="live-preview" aria-live="polite">
            <h3 class="preview-title">Preview</h3>
            <div class="preview-card" id="previewCard" aria-hidden="false">
              <p class="preview-to" id="previewTo">To: —</p>
              <p class="preview-msg" id="previewMsg">Your message will appear here...</p>
            </div>
          </div>
        </article>
      </div>
    </section>

    <!-- transient visual effects container -->
    <div id="effects" aria-hidden="true"></div>

    <footer class="footer">
      <small>Made with ❤️</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
