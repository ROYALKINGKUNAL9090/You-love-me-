<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me? 🧸</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #12131c;
    }

    /* Dark outer container */
    .wrapper {
      background: linear-gradient(135deg, #212433, #2d3148);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 320px;
      text-align: center;
    }

    /* Inner white card */
    .card-content {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    h2 {
      color: #ff3366;
      font-size: 20px;
    }

    .bear {
      font-size: 80px;
      user-select: none;
    }

    /* Button area - relative positioning for moving button */
    .buttons {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 60px;
    }

    button {
      padding: 10px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    .btn-yes {
      background: #ff3366;
      color: white;
      position: absolute;
      left: 30px;
    }

    /* "No" Button with absolute positioning and transition */
    .btn-no {
      background: #e0e0e0;
      color: #333;
      position: absolute;
      right: 30px;
      transition: transform 0.15s ease-out;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="card-content">
      <h2 id="title">Do You Love me?</h2>
      <div class="bear" id="bear">🧸</div>

      <div class="buttons" id="btnGroup">
        <button class="btn-yes" id="yesBtn">Yes</button>
        <button class="btn-no" id="noBtn">No</button>
      </div>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const title = document.getElementById('title');
    const bear = document.getElementById('bear');
    const btnGroup = document.getElementById('btnGroup');

    // Function to move "No" button when hovered or touched
    function moveNoBtn() {
      // Generate random movement offsets
      const randomX = (Math.random() - 0.5) * 160;
      const randomY = (Math.random() - 0.5) * 100;

      // Apply coordinates
      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    // Attach listeners for both Mouse (Desktop) & Touch (Mobile)
    noBtn.addEventListener('mouseenter', moveNoBtn);
    noBtn.addEventListener('mouseover', moveNoBtn);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault(); // Prevents clicking on mobile touch
      moveNoBtn();
    });

    // When "Yes" is clicked
    yesBtn.addEventListener('click', () => {
      title.textContent = "I knew it! 🧸❤️";
      bear.textContent = "🧸🥰";
      btnGroup.style.display = 'none';
    });
  </script>

</body>
</html>
<script src="script.js"></script>
<link rel="stylesheet" href="style.css">
