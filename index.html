<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me? 🧸</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #12131c;
    }
    .card {
      background: linear-gradient(135deg, #212433, #2d3148);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      width: 320px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .inner-box {
      background: #fff;
      padding: 30px 20px;
      border-radius: 20px;
    }
    h2 { color: #ff3366; font-size: 22px; margin-bottom: 15px; }
    .bear {
      font-size: 80px;
      margin: 10px 0;
      display: inline-block;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      position: relative;
    }
    button {
      padding: 10px 24px;
      border-radius: 20px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .yes-btn { background: #ff3366; color: white; }
    .no-btn { background: #e0e0e0; color: #333; position: absolute; right: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="inner-box">
      <h2 id="text">Do You Love me?</h2>
      <div class="bear" id="bear">🧸</div>
      <div class="buttons" id="btnContainer">
        <button class="yes-btn" onclick="sayYes()">Yes</button>
        <button class="no-btn" id="noBtn" onmouseover="moveNo()">No</button>
      </div>
    </div>
  </div>

  <script>
    function moveNo() {
      const btn = document.getElementById('noBtn');
      const x = Math.floor(Math.random() * 160) - 80;
      const y = Math.floor(Math.random() * 100) - 50;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function sayYes() {
      document.getElementById('text').innerText = "I knew it! 🧸❤️";
      document.getElementById('bear').innerText = "🧸🥰";
      document.getElementById('btnContainer').style.display = 'none';
    }
  </script>
</body>
</html>
<script src="script.js"></script>
<link rel="stylesheet" href="style.css">
